plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bookscan.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.bookscan.app"
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName "4.9"

        ndk {
            // OpenCV 네이티브 라이브러리 — 요즘 폰만 담아 용량을 줄인다
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress 'onnx', 'tflite'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            // APK 안에서 바로 여는 방식(false)은 일부 폰에서 로딩이 실패한다.
            // 설치할 때 풀어놓게 해 가장 호환성 높은 방식으로 둔다.
            useLegacyPackaging true
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // 카메라 — 미리보기·실시간 분석·촬영
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // 정밀 촬영(구글 문서 스캐너 — 모델·화면은 플레이 서비스가 내려준다)
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // 글자 인식(오프라인, 한국어)
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    // 테두리 검출 — ONNX 모델 실행기(DocAligner용)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // 테두리 검출(학습 모델, Apache-2.0)
    implementation 'com.github.pqpo:SmartCropper:v2.1.4'

    // 페이지 윤곽 검출
    implementation 'org.opencv:opencv:4.12.0'
}
